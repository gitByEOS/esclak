[project]
name = "esclak"
dynamic = ["version"]
description = "固定流程脚本 TUI 与无头执行"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0.0",
    "wcwidth>=0.2.13",
]

[project.urls]
Homepage = "https://github.com/gitByEOS/esclak"
Repository = "https://github.com/gitByEOS/esclak"
Examples = "https://github.com/gitByEOS/esclak/tree/master/examples"

[project.scripts]
clak = "clak.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/clak/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clak"]

[tool.hatch.build.targets.sdist]
include = ["src/clak", "examples", "skills/clak", "docs/images/logo.svg", "docs/tech.md", "docs/task.md", "README.md", "CHANGELOG.md", "AGENTS.md", "LICENSE"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
