[project]
name = "clak-py"
version = "0.1.0"
description = "固定流程脚本 TUI 与无头执行"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0.0",
    "wcwidth>=0.2.13",
]

[project.scripts]
clak-py = "clak_py.cli:main"
clak = "clak_py.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clak_py"]

[tool.hatch.build.targets.sdist]
include = ["src/clak_py", "README.md"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
